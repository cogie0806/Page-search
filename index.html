<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cogie0806 サイト内検索</title>
  <style>
    body {
      font-family: "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: transparent; /* 親ページの背景に馴染ませる */
      color: #333;
      margin: 0;
      padding: 8px;
      box-sizing: border-box;
    }
    .search-header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      padding: 6px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 8px;
      z-index: 10;
    }
    #searchInput {
      width: 100%;
      padding: 8px 14px;
      font-size: 14px;
      border: 2px solid #1a73e8;
      border-radius: 20px;
      box-sizing: border-box;
      outline: none;
    }
    #searchInput:focus {
      box-shadow: 0 0 6px rgba(26,115,232,0.3);
    }
    #hitCount {
      font-size: 12px;
      color: #555;
      margin: 4px 0 0 8px;
    }
    .result-card {
      display: block;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      text-decoration: none;
      color: inherit;
      border: 1px solid #dcdcdc;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .result-card:hover {
      background-color: #f0f7ff;
      border-color: #1a73e8;
    }
    .card-title {
      font-size: 14px;
      font-weight: bold;
      color: #1a73e8;
      margin-bottom: 3px;
    }
    .card-desc {
      font-size: 12px;
      color: #444;
      line-height: 1.4;
    }
    .no-result {
      text-align: center;
      padding: 20px 10px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

  <!-- スクロールしても検索窓が上に固定される -->
  <div class="search-header">
    <input type="text" id="searchInput" placeholder="🔍 キーワードを入力（例：マイクラ、タイピング、電卓...）">
    <div id="hitCount"></div>
  </div>

  <div id="resultArea"></div>

  <!-- 検索結果.js（search.js）を読み込み -->
  <script src="search.js"></script>

</body>
</html>
